<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Invest Dashboard</title>
  <link rel="stylesheet" href="style.css?v=20260506-trade-alerts" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Investment Dashboard</p>
      <h1>투자 대시보드</h1>
      <p id="updated" class="muted">loading...</p>
    </div>
    <div class="status-pill" id="overallStatus">확인 중</div>
  </header>

  <main>
    <section class="summary-grid" id="summaryGrid"></section>

    <nav class="tabs" id="tabs"></nav>

    <section class="panel active" id="panel-overview">
      <div class="grid two">
        <div class="card wide">
          <div class="card-head">
            <h2>평가금액 흐름</h2>
            <span class="muted">자본금 대비 현재 평가금액</span>
          </div>
          <canvas id="amountChart" height="130"></canvas>
        </div>
        <div class="card wide">
          <div class="card-head">
            <h2>수익률 비교</h2>
            <span class="muted">우리 수익률 vs 시장 기간 수익률</span>
          </div>
          <canvas id="returnChart" height="130"></canvas>
        </div>
      </div>
      <div class="grid two" id="sessionCards"></div>
    </section>

    <section id="sessionPanels"></section>
  </main>


  <script src="app.js?v=20260506-trade-alerts"></script>
</body>
</html>
