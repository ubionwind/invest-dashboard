<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Invest Dashboard</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="style-scorelabel-a1dfd3f.css?v=20260510-score-label" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Investment Dashboard</p>
      <h1>투자 대시보드</h1>
      <p id="updated" class="muted">loading...</p>
    </div>
    <div class="status-pill" id="overallStatus">확인 중</div>
  </header>

  <main>
    <section class="summary-grid" id="summaryGrid"></section>

    <div class="dashboard-shell">
      <nav class="tabs" id="tabs" aria-label="전략별 대시보드 탭"></nav>

      <div class="dashboard-panels">
        <section class="panel active" id="panel-overview">
          <div class="overview-chart-stack">
            <div class="card wide overview-chart-card">
              <div class="card-head">
                <h2>수익률 비교</h2>
                <span class="muted">정규장 09:00~15:30 기준 · 실선=전략 · 흰점선=KOSPI · 연두점선=KODEX200</span>
              </div>
              <canvas id="returnChart" height="260"></canvas>
            </div>
            <div class="card wide overview-chart-card">
              <div class="card-head">
                <h2>평가금액 흐름</h2>
                <span class="muted">정규장 09:00~15:30 기준 · 자본금 대비 현재 평가금액</span>
              </div>
              <canvas id="amountChart" height="260"></canvas>
            </div>
          </div>
          <div class="overview-guide card">
            <strong>전략별 상세는 왼쪽 탭에서 선택</strong>
            <span class="muted">모바일에서는 화면 하단 탭으로 전환됩니다.</span>
          </div>
          <div class="grid two" id="sessionCards"></div>
        </section>

        <section id="sessionPanels"></section>
      </div>
    </div>
    <section id="actionMatrix" class="action-matrix-wrap"></section>
  </main>


  <script>
    window.DASHBOARD_MANIFEST_URL = 'data/test/manifest.json';
    window.DASHBOARD_DATA_URL = 'data/test/dashboard-data.json';
  </script>
  <script src="app-action-strategyrows-948129d.js?v=20260510-strategy-rows"></script>
</body>
</html>
